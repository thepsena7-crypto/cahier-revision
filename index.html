<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mon Cahier de Révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root { --bg: #f2f3f8; --sheet: #ffffff; --ink: #1c1f2e; --muted: #646a80; --line: #e2e4ee; --acc: #4a72de; --bad: #c2392f; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #11121b; --sheet: #1a1c28; --ink: #eceef7; --muted: #a0a6bb; --line: #2b2e40; --acc: #8aa8f5; --bad: #f58d82; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 380px; background: var(--sheet); border-radius: 20px; padding: 28px; box-shadow: 0 18px 40px -16px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 14px; animation: up .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.logo { width: 34px; height: 34px; border-radius: 10px; background: conic-gradient(#e0664e, #4a72de, #149c8a, #9660d4, #dd8f1f, #4a9530, #c43d78, #e0664e); }
h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 1.6rem; margin: 0; line-height: 1.1; }
p { margin: 0; color: var(--muted); }
label { font-weight: 700; font-size: .9rem; }
input[type=password] { font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
input[type=password]:focus { outline: none; border-color: var(--acc); }
.rem { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--muted); }
button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px; background: var(--ink); color: var(--bg); cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--bad); font-weight: 700; min-height: 1.4em; }
.shake { animation: shake .4s; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo" aria-hidden="true"></div>
  <h1>Cahier de révision</h1>
  <p>Site privé. Entre le mot de passe pour l’ouvrir.</p>
  <input type="text" name="username" value="cahier" autocomplete="username" hidden>
  <label for="pw">Mot de passe</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="rem"><input id="rem" type="checkbox" checked> Rester connecté sur cet appareil</label>
  <button id="go" type="submit">Ouvrir</button>
  <div class="err" id="err" role="alert"></div>
</form>

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: ub(P.salt), iterations: P.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub(P.iv) }, key, ub(P.ct));
  return new TextDecoder().decode(buf);
}
function show(html) { document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  go.disabled = true; go.textContent = "Vérification…"; err.textContent = "";
  try {
    const html = await unlock(pw);
    if (document.getElementById("rem").checked) { try { localStorage.setItem("cahier-pw", pw); } catch (x) {} }
    show(html);
  } catch (x) {
    err.textContent = "Mot de passe incorrect.";
    f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    go.disabled = false; go.textContent = "Ouvrir";
  }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem("cahier-pw"); } catch (x) {}
  if (saved) { try { show(await unlock(saved)); } catch (x) { try { localStorage.removeItem("cahier-pw"); } catch (y) {} } }
})();
})();
